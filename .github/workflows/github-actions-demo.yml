name: EMotorSoftwareMBD Pipeline

on:
  push:
    branches: [ master ]
  # Uncomment to allow manual triggers:
  # workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  PATH_TO_MATLAB: /opt/matlab/R2025b

jobs:
  # =====================================================
  # 1. Restore Cache
  # =====================================================
  Restore_Cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          key: padv_artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: padv_artifacts-cache
          path: |
            PA_Results/CalculateFeedforwardVoltages/model_standards_results
            PA_Results/CalculateMaximumFluxLimit/model_standards_results
            PA_Results/CalculateOptimalFlux/model_standards_results
            PA_Results/CalculateTorqueLimits/model_standards_results
            PA_Results/FluxWeakeningControl/model_standards_results
            PA_Results/RsCalculation/model_standards_results
            derived/artifacts.dmr

      - name: Upload Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: 01_Restore_Cache_padv_artifacts
          path: |
            PA_Results/CalculateFeedforwardVoltages/model_standards_results
            PA_Results/CalculateMaximumFluxLimit/model_standards_results
            PA_Results/CalculateOptimalFlux/model_standards_results
            PA_Results/CalculateTorqueLimits/model_standards_results
            PA_Results/FluxWeakeningControl/model_standards_results
            PA_Results/RsCalculation/model_standards_results
            derived/artifacts.dmr
          retention-days: 90

  # =====================================================
  # 2. Task 1 — Generate Requirements Report
  # =====================================================
  Task1_GenerateRequirementsReport:
    runs-on: ubuntu-latest
    needs: Restore_Cache
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }} # Uses environment secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: |
            Simulink
            Stateflow
            Simulink_Test
            Simulink_Coverage
            Simulink_Check
            Requirements_Toolbox
            CI/CD_Automation_for_Simulink_Check
            MATLAB_Coder
            Simulink_Coder
            Embedded_Coder
            System_Composer
            Simulink_Design_Verifier
            Powertrain_Blockset
            Simulink_Report_Generator
            Simulink_Control_Design
          release: R2025b
          cache: true

      - name: Run Task 1
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks="padv.builtin.task.GenerateRequirementsReport", ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);

      - name: Upload Task 1 Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Task1_RequirementsReport
          path: |
            PA_Results/TractionEmotorRequirements/report
            derived/artifacts.dmr

  # =====================================================
  # 3. Task 2 — Run Model Standards Check
  # =====================================================
  Task2_CheckModelingStandards:
    runs-on: ubuntu-latest
    needs: Task1_GenerateRequirementsReport
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: |
            Simulink
            Stateflow
            Simulink_Test
            Simulink_Coverage
            Simulink_Check
            Requirements_Toolbox
            CI/CD_Automation_for_Simulink_Check
            MATLAB_Coder
            Simulink_Coder
            Embedded_Coder
            System_Composer
            Simulink_Design_Verifier
            Powertrain_Blockset
            Simulink_Report_Generator
            Simulink_Control_Design
          release: R2025b
          cache: true

      - name: Run Task 2
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks="padv.builtin.task.RunModelStandards", ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);

      - name: Upload Task 2 Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Task2_ModelStandards
          path: |
            PA_Results/CalculateFeedforwardVoltages/model_standards_results
            PA_Results/CalculateMaximumFluxLimit/model_standards_results
            PA_Results/CalculateOptimalFlux/model_standards_results
            PA_Results/CalculateTorqueLimits/model_standards_results
            PA_Results/FluxWeakeningControl/model_standards_results
            PA_Results/RsCalculation/model_standards_results

  # =====================================================
  # 4. Task 3 — Run Tests Per Test Case
  # =====================================================
  Task3_RunTests:
    runs-on: ubuntu-latest
    needs: Task2_CheckModelingStandards
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: |
            Simulink
            Stateflow
            Simulink_Test
            Simulink_Coverage
            Simulink_Check
            Requirements_Toolbox
            CI/CD_Automation_for_Simulink_Check
            MATLAB_Coder
            Simulink_Coder
            Embedded_Coder
            System_Composer
            Simulink_Design_Verifier
            Powertrain_Blockset
            Simulink_Report_Generator
            Simulink_Control_Design
          release: R2025b
          cache: true

      - name: Run Task 3
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks="padv.builtin.task.RunTestsPerTestCase", ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);

      - name: Upload Task 3 Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Task3_TestResults
          path: |
            PA_Results/test_results
            derived/artifacts.dmr

  # =====================================================
  # 5. Task 4 — Generate Code
  # =====================================================
  Task4_GenerateCode:
    runs-on: ubuntu-latest
    needs: Task3_RunTests
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: |
            Simulink
            Stateflow
            Simulink_Test
            Simulink_Coverage
            Simulink_Check
            Requirements_Toolbox
            CI/CD_Automation_for_Simulink_Check
            MATLAB_Coder
            Simulink_Coder
            Embedded_Coder
            System_Composer
            Simulink_Design_Verifier
            Powertrain_Blockset
            Simulink_Report_Generator
            Simulink_Control_Design
          release: R2025b
          cache: true

      - name: Run Task 4
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks="padv.builtin.task.GenerateCode", ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);

      - name: Upload Task 4 Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Task4_GeneratedCode
          path: |
            AutoCodeGen
            derived/artifacts.dmr

  # =====================================================
  # 6. Task 5 — Merge Test Results
  # =====================================================
  Task5_MergeTestResults:
    runs-on: ubuntu-latest
    needs: Task4_GenerateCode
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: |
            Simulink
            Stateflow
            Simulink_Test
            Simulink_Coverage
            Simulink_Check
            Requirements_Toolbox
            CI/CD_Automation_for_Simulink_Check
            MATLAB_Coder
            Simulink_Coder
            Embedded_Coder
            System_Composer
            Simulink_Design_Verifier
            Powertrain_Blockset
            Simulink_Report_Generator
            Simulink_Control_Design
          release: R2025b
          cache: true

      - name: Run Task 5
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks="padv.builtin.task.MergeTestResults", ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);

      - name: Upload Task 5 Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Task5_MergedResults
          path: |
            PA_Results/test_results
            derived/artifacts.dmr
