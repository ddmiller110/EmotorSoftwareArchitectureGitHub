name: EMotorSoftwareMBD Pipeline

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  checks: write

jobs:

  # =====================================================
  # 1. Restore Cache (Optional - if you need it)
  # =====================================================
  Restore_Cache:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore MATLAB Cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .matlab
          key: matlab-cache-${{ runner.os }}
          restore-keys: matlab-cache-

  # =====================================================
  # 2. Task 1 — Generate Requirements Report
  # =====================================================
  Task1_GenerateRequirementsReport:
    runs-on: ubuntu-latest
    needs: Restore_Cache

    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
          products: >
            Simulink
            Stateflow
            Simulink_Test
            Simulink_Coverage
            Simulink_Check
            Requirements_Toolbox
            CI/CD_Automation_for_Simulink_Check
            MATLAB_Coder
            Simulink_Coder
            Embedded_Coder
            System_Composer
            Simulink_Design_Verifier
            Powertrain_Blockset
            Simulink_Report_Generator
            Simulink_Control_Design

      - name: Run Task 1
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks="padv.builtin.task.GenerateRequirementsReport", ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);

  # =====================================================
  # 3. Task 2 — Run Model Standards Check
  # =====================================================
  Task2_CheckModelingStandards:
    runs-on: ubuntu-latest
    needs: Task1_GenerateRequirementsReport

    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b

      - name: Run Task 2
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks="padv.builtin.task.RunModelStandards", ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);

  # =====================================================
  # 4. Task 3 — Run Tests Per Test Case
  # =====================================================
  Task3_RunTests:
    runs-on: ubuntu-latest
    needs: Task2_RunModelStandards

    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b

      - name: Run Task 3
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks="padv.builtin.task.RunTestsPerTestCase", ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);

  # =====================================================
  # 5. Task 4 — Generate Code
  # =====================================================
  Task4_GenerateCode:
    runs-on: ubuntu-latest
    needs: Task3_RunTestsPerTestCase

    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b

      - name: Run Task 4
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks="padv.builtin.task.GenerateCode", ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);

  # =====================================================
  # 6. Task 5 — Merge Test Results
  # =====================================================
  Task5_MergeTestResults:
    runs-on: ubuntu-latest
    needs: Task4_GenerateCode

    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b

      - name: Run Task 5
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks="padv.builtin.task.MergeTestResults", ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);
