name: EMotorSoftwareMBD Pipeline

on:
  push:
    branches: [ master ]

env:
  PATH_TO_MATLAB: /opt/matlab/R2025b

jobs:

  # ----------------------------------------------------
  # 1. Restore Cache
  # ----------------------------------------------------
  Restore_Cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore MATLAB Cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .matlab
          key: cache-matlab-${{ runner.os }}
          restore-keys: cache-matlab-

  # ----------------------------------------------------
  # 2. Task A — Generate Requirements Report
  # ----------------------------------------------------
  TaskA_GenerateRequirementsReport:
    runs-on: ubuntu-latest
    needs: Restore_Cache
    steps:
      - uses: actions/checkout@v4

      - name: Run Task A
        run: |
          $PATH_TO_MATLAB/bin/matlab -batch "
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks='padv.builtin.task.GenerateRequirementsReport', ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);
          "

      - name: Save MATLAB Cache
        uses: actions/cache/save@v4
        with:
          path: .matlab
          key: cache-matlab-${{ runner.os }}-${{ github.run_id }}

  # ----------------------------------------------------
  # 3. Task B — Run Model Standards
  # ----------------------------------------------------
  TaskB_RunModelStandards:
    runs-on: ubuntu-latest
    needs: TaskA_GenerateRequirementsReport
    steps:
      - uses: actions/checkout@v4

      - name: Run Task B
        run: |
          $PATH_TO_MATLAB/bin/matlab -batch "
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks='padv.builtin.task.RunModelStandards', ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);
          "

  # ----------------------------------------------------
  # 4. Task C — Run Tests Per Test Case
  # ----------------------------------------------------
  TaskC_RunTestsPerTestCase:
    runs-on: ubuntu-latest
    needs: TaskB_RunModelStandards
    steps:
      - uses: actions/checkout@v4

      - name: Run Task C
        run: |
          $PATH_TO_MATLAB/bin/matlab -batch "
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks='padv.builtin.task.RunTestsPerTestCase', ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);
          "

  # ----------------------------------------------------
  # 5. Task D — Generate Code
  # ----------------------------------------------------
  TaskD_GenerateCode:
    runs-on: ubuntu-latest
    needs: TaskC_RunTestsPerTestCase
    steps:
      - uses: actions/checkout@v4

      - name: Run Task D
        run: |
          $PATH_TO_MATLAB/bin/matlab -batch "
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks='padv.builtin.task.GenerateCode', ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);
          "

  # ----------------------------------------------------
  # 6. Task E — Merge Test Results
  # ----------------------------------------------------
  TaskE_MergeTestResults:
    runs-on: ubuntu-latest
    needs: TaskD_GenerateCode
    steps:
      - uses: actions/checkout@v4

      - name: Run Task E
        run: |
          $PATH_TO_MATLAB/bin/matlab -batch "
            openProject(pwd);
            runprocess(Process='CIPipeline', ...
              Tasks='padv.builtin.task.MergeTestResults', ...
              Force=false, ExitInBatchMode=true, ...
              RerunFailedTasks=false, RerunErroredTasks=false, ...
              GenerateJUnitForProcess=false);
          "
