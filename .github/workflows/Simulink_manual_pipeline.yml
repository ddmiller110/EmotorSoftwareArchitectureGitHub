name: Simulink_manual_pipeline
# TRIGGER CONDITIONS (on:)
# Defines the GitHub events that will automatically start this workflow.
on:
  push:
    # The workflow runs whenever code is pushed to the 'master' branch.
    branches: [master]
  # Allow manual triggers from the GitHub Actions UI ("Run workflow" button).
  workflow_dispatch:

permissions:
  # Allows the workflow to check out (read) repository files.
  contents: read
  checks: write # ← needed for visual test reporting

env:
  # MLM_LICENSE_TOKEN is the MathWorks batch licensing token required to
  # activate MATLAB on GitHub-hosted runners (which have no license server).
  MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}

# =============================================================================
# JOBS
# Each job runs independently in its own runner environment (a fresh VM).
# Jobs can run in parallel or be sequenced using the 'needs:' keyword.
# =============================================================================
jobs:

  # ===========================================================================
  # Task 1 — Run MIL Tests
  # ===========================================================================
  Task1_RunTests:
    # 'ubuntu-latest' uses the most recent stable Ubuntu image available on
    # GitHub-hosted runners. It is free for public repos and counts against
    # minutes for private repos.
    runs-on: ubuntu-latest

    steps:
      # The 'actions/checkout' action clones the repository into the runner's
      # workspace so subsequent steps can access source files.
      - uses: actions/checkout@v6

      # The 'matlab-actions/setup-matlab' action installs MATLAB and the
      # specified toolboxes on the runner.
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: |
            Simulink
            Stateflow
            Simulink_Test
            Simulink_Coverage
            Simulink_Check
            Requirements_Toolbox
            System_Composer
            Simulink_Design_Verifier
            Powertrain_Blockset
            Simulink_Report_Generator
            Simulink_Control_Design
          release: R2026a
          # 'cache: true': Caches the MATLAB installation between runs so the
          # installer doesn't re-download gigabytes of toolboxes every time.
          cache: true

      # calls the script to execute Simulink Test Manager and run all test cases
      - name: Run Simulink Tests
        uses: matlab-actions/run-command@v3
        with:
          command: |
            openProject(pwd);
            RunTests_CI;

      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: TestResults
          path: Tests/results.xml

      - name: Publish Test Results
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Test Results
          path: Tests/results.xml
          reporter: java-junit

  #==================================================
  # Task 2 — Generate Code for Simulink Behavior Models
  # ===========================================================================
  Task2_GenerateCode:
    runs-on: ubuntu-latest
    # 'needs:' ensures code is only generated if Task 1 (tests) passed.
    # Don't generate production code from a model that hasn't been verified.
    needs: Task1_RunTests

    steps:
      - uses: actions/checkout@v6

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: |
            Simulink
            Stateflow
            Embedded_Coder
            Simulink_Coder
            MATLAB_Coder
          release: R2026a
          cache: true

      - name: Generate C Code
        uses: matlab-actions/run-command@v3
        with:
          command: |
            openProject(pwd);
            GenerateCode_CI;

      - name: Upload Generated Code
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: GeneratedCode
          path: AutoCodeGen/