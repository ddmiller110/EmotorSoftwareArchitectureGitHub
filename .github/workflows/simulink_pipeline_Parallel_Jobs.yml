name: Simulink Pipeline Parallel Jobs
on:
  push:
    branches: [ master ]
  # workflow_dispatch:
permissions:
  contents: read
  checks: write
env:
  # Global License Token (available to all jobs)
  MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}
jobs:
  # =====================================================
  # 1. PREPARE BASE STATE (Restore Cache & Distribute)
  # =====================================================
  Prepare_Base_State:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # 💡 UPDATED CACHE: Use branch name for key to enable future runs to restore this cache.
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          key: padv_artifacts-${{ github.ref_name }}
          restore-keys: padv_artifacts-${{ github.ref_name }}-
          path: |
            PA_Results
            derived/artifacts.dmr
            AutoCodeGen
            
      # FIX: Ensure directories exist 
      - name: Ensure Artifact Directories Exist
        run: mkdir -p PA_Results derived AutoCodeGen
        
      # 💡 FIX ARTIFACT UPLOAD: Create a placeholder if the cache missed.
      # This ensures the 'derived' folder is not empty, allowing the artifact to be uploaded.
      - name: Create Placeholder File
        run: |
          if [ ! -f "derived/artifacts.dmr" ]; then
            echo "placeholder" > derived/artifacts.dmr
          fi
          
      # Upload this state so parallel jobs can download it
      - name: Upload Base State Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Base_State_Artifact
          path: |
            PA_Results
            derived
            AutoCodeGen
          retention-days: 1
          if-no-files-found: error # Changed to 'error' to fail if files are genuinely missing
          
  # =====================================================
  # 2. PARALLEL TASKS (Must download Base State first)
  # =====================================================
  
  Task1_GenerateRequirementsReport:
    runs-on: ubuntu-latest
    needs: Prepare_Base_State
    steps:
      - uses: actions/checkout@v4
      
      # 1. Download the state from the first job
      - name: Download Base State
        uses: actions/download-artifact@v4
        with:
          name: Base_State_Artifact
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: |
            Simulink
            Requirements_Toolbox
            Simulink_Report_Generator
            # (Add other necessary toolboxes for this specific task)
          release: R2025b
          cache: true
      - name: Run Task 1
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', Tasks="padv.builtin.task.GenerateRequirementsReport", Force=false, ExitInBatchMode=true);
      # Upload ONLY the specific results from this task
      - name: Upload Task 1 Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Result_Task1
          path: PA_Results/TractionEmotorRequirements
          
  Task2_CheckModelingStandards:
    runs-on: ubuntu-latest
    needs: Prepare_Base_State
    steps:
      - uses: actions/checkout@v4
      - name: Download Base State
        uses: actions/download-artifact@v4
        with:
          name: Base_State_Artifact
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Simulink Simulink_Check Stateflow
          release: R2025b
          cache: true
      - name: Run Task 2
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', Tasks="padv.builtin.task.RunModelStandards", Force=false, ExitInBatchMode=true);
      - name: Upload Task 2 Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Result_Task2
          path: |
             PA_Results/CalculateFeedforwardVoltages
             PA_Results/CalculateMaximumFluxLimit
             PA_Results/CalculateOptimalFlux
             PA_Results/CalculateTorqueLimits
             PA_Results/FluxWeakeningControl
             PA_Results/RsCalculation
             
  Task3_RunTests:
    runs-on: ubuntu-latest
    needs: Prepare_Base_State
    steps:
      - uses: actions/checkout@v4
      - name: Download Base State
        uses: actions/download-artifact@v4
        with:
          name: Base_State_Artifact
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Simulink Simulink_Test Simulink_Coverage
          release: R2025b
          cache: true
      - name: Run Task 3
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', Tasks="padv.builtin.task.RunTestsPerTestCase", Force=false, ExitInBatchMode=true);
      - name: Upload Task 3 Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Result_Task3
          path: PA_Results/test_results
          
  Task4_GenerateCode:
    runs-on: ubuntu-latest
    needs: Prepare_Base_State
    steps:
      - uses: actions/checkout@v4
      - name: Download Base State
        uses: actions/download-artifact@v4
        with:
          name: Base_State_Artifact
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: MATLAB_Coder Simulink_Coder Embedded_Coder
          release: R2025b
          cache: true
      - name: Run Task 4
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', Tasks="padv.builtin.task.GenerateCode", Force=false, ExitInBatchMode=true);
      - name: Upload Task 4 Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Result_Task4
          path: AutoCodeGen
          
  # =====================================================
  # 3. MERGE & FINALIZE (Fan-In)
  # =====================================================
  Task5_MergeAndCache:
    runs-on: ubuntu-latest
    needs: [Task1_GenerateRequirementsReport, Task2_CheckModelingStandards, Task3_RunTests, Task4_GenerateCode]
    steps:
      - uses: actions/checkout@v4
      # 1. Download ALL artifacts from previous parallel jobs
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: merged_artifacts
          merge-multiple: true 
          
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Simulink Simulink_Report_Generator Simulink_Test
          release: R2025b
          cache: true
          
      - name: Run Merge Task
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            runprocess(Process='CIPipeline', Tasks="padv.builtin.task.MergeTestResults", Force=false, ExitInBatchMode=true);
            
      # 2. Save the final state to the GitHub Cache for the NEXT run
      # 💡 UPDATED CACHE: Key uses branch name to ensure the cache is restorable by future runs.
      - name: Save Final Build Cache
        uses: actions/cache/save@v4
        with:
          key: padv_artifacts-${{ github.ref_name }}
          path: |
            PA_Results
            derived/artifacts.dmr
            AutoCodeGen
            
      - name: Upload Final Merge Report
        uses: actions/upload-artifact@v4
        with:
          name: Final_Pipeline_Report
          path: PA_Results