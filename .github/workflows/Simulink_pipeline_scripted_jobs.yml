name: Simulink Pipeline Scripted Jobs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  Task1_RunTests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: |
            Simulink
            Stateflow
            Simulink_Test
            Simulink_Coverage
            Simulink_Check
            Requirements_Toolbox
            System_Composer
            Simulink_Design_Verifier
            Powertrain_Blockset
            Simulink_Report_Generator
            Simulink_Control_Design
          release: R2026a
          cache: true

      - name: Run Simulink Tests
        uses: matlab-actions/run-command@v3
        with:
          command: |
            openProject(pwd);
            RunTests_CI;

      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: TestResults
          path: Tests/results.xml

      - name: Publish Test Results
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Test Results
          path: Tests/results.xml
          reporter: java-junit

  Task2_GenerateCode:
    runs-on: ubuntu-latest
    needs: Task1_RunTests

    steps:
      - uses: actions/checkout@v6

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: |
            Simulink
            Stateflow
            Embedded_Coder
            Simulink_Coder
            MATLAB_Coder
          release: R2026a
          cache: true

      - name: Generate C Code
        uses: matlab-actions/run-command@v3
        with:
          command: |
            openProject(pwd);
            GenerateCode_CI;

      - name: Upload Generated Code
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: GeneratedCode
          path: AutoCodeGen/